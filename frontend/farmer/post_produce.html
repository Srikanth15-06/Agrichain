<script src="/api-config.js"></script>

<body>

         <h2>Post Your Produce</h2>

    <form id="produceForm" enctype="multipart/form-data">
      <input type="text" id="title" placeholder="Produce Title" required /><br>
      <input type="text" id="quantity" placeholder="Quantity (e.g. 100kg)" required /><br>
      <input type="number" id="price" placeholder="Price per Kg (₹)" required /><br>
      <input type="text" id="location" placeholder="Location" required /><br>
      <label>Image:</label>
      <input type="file" id="image" name="image" accept="image/*" required />
      <button type="submit">Post Produce</button><br>
      <button type="button" onclick="window.location.href='farmer_dashboard.html'" style="margin-top: -20px;">⬅ Back to Dashboard</button>
       <div id="messageBox" class="message"></div>
    </form>
  </div>

       form.addEventListener("submit", function (e) {
  e.preventDefault();

  const formData = new FormData();
  formData.append("title", document.getElementById("title").value);
  formData.append("quantity", document.getElementById("quantity").value);
  formData.append("pricePerKg", document.getElementById("price").value);
  formData.append("location", document.getElementById("location").value);
  formData.append("image", document.getElementById("image").files[0]);

  fetch(`${window.API_BASE_URL}/api/produce`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${token}`,
    },
    body: formData,
  })
    .then(async (response) => {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || data.error || "Could not post produce.");
      }
      return data;
    })
    .then((data) => {
      messageBox.textContent = data.message || "Produce posted successfully.";
      messageBox.className = "message success";
      form.reset();
    })
    .catch((err) => {
      console.error("Produce submission failed:", err);
      messageBox.textContent = err.message || "Server error. Try again later.";
      messageBox.className = "message error";
    });
});
