<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriChain | Home</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    header {
      z-index: 2;
    }
    .navbar nav a {
      padding: 8px 14px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
    .navbar nav a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(15vh + 24px) 24px 96px;
    }
    .dashboard {
      width: min(1200px, 100%);
      margin: 0;
      padding: 24px;
      background: rgba(218, 239, 214, 0.5);
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(218, 239, 214, 0.9);
    }
    .dashboard > h2 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #2d572c;
      text-align: center;
    }
    #dashboardStats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }
    .stat-card {
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .stat-card h3 {
      margin: 0;
      color: #2e7d32;
      font-size: 1rem;
      line-height: 1.3;
    }
    .stat-card p {
      margin: 0;
      color: #333;
      font-size: 1.5rem;
      line-height: 1.2;
    }
    .dashboard-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 24px 0 0;
    }
    .dashboard-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin: 0;
      padding: 10px 16px;
      color: #fff;
      background: #2e7d32;
      border: 0;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .dashboard-actions a:hover {
      background: #1b5e20;
    }
    #notifications {
      margin-top: 24px;
      padding: 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
    }
    #notifications h3 {
      margin-bottom: 8px;
      color: #2d572c;
    }
    #notifications p {
      margin: 0;
    }
    footer {
      position: static;
    }
    #dashboardError {
      grid-column: 1 / -1;
      padding: 16px;
      color: #721c24;
      background: #f8d7da;
      border-radius: 8px;
      text-align: center;
    }
    @media (max-width: 600px) {
      section {
        padding: calc(15vh + 16px) 12px 80px;
      }
      .dashboard {
        padding: 16px;
      }
      #dashboardStats {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .stat-card {
        min-height: 84px;
      }
    }
  </style>
<script src="/api-config.js"></script>
</head>

<body>
  <header>
    <div class="navbar">
        <img src="../assets/images/ac_logo.png" alt="agrichian logo" class="logo">
      <h1>Welcome, <span id="userName"></span></h1>
      <nav>
        <a href="#" id="logoutLink">Logout</a>
      </nav>
    </div>
  </header>

  <section>
    <img src="../assets/images/image.png" alt="AgriChain Logo" class="back" />
    <div class="dashboard">
      <h2>Admin Dashboard</h2>

      <div id="dashboardStats"></div>
      <nav class="dashboard-actions" aria-label="Admin management">
        <a href="view_users.html">Manage Users</a>
        <a href="view_produce.html">Manage Produce</a>
        <a href="manage_orders.html">Manage Orders</a>
      </nav>

      <div id="notifications">
        <h3>Notifications</h3>
        <p>No new notifications.</p>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 AgriChain. All rights reserved.</p>
  </footer>
<script>
  const token = localStorage.getItem("token");
  const statsContainer = document.getElementById("dashboardStats");

  document.getElementById("logoutLink").addEventListener("click", event => {
    event.preventDefault();
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    window.location.href = "../login.html";
  });

  if (!token) {
    window.location.href = "../login.html";
  } else {
    loadDashboard();
    loadAdminName();
  }

  async function loadDashboard() {
    try {
      const response = await fetch(`${window.API_BASE_URL}/api/admin/dashboard/stats`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || "Could not load dashboard statistics.");
      }

      const metrics = [
        ["Total Users", data.totalUsers],
        ["Total Buyers", data.totalBuyers],
        ["Total Admins", data.totalAdmins],
        ["Total Farmers", data.totalFarmers],
        ["Verified Farmers", data.verifiedFarmers],
        ["Unverified Farmers", data.unverifiedFarmers],
        ["Total Produce", data.totalProduce],
        ["Approved Produce", data.verifiedProduce],
        ["Unapproved Produce", data.unverifiedProduce],
        ["Total Orders", data.totalOrders],
        ["Pending Orders", data.pendingOrders],
        ["Accepted Orders", data.acceptedOrders],
        ["Rejected Orders", data.rejectedOrders],
        ["Buyers With Orders", data.totalBuyersPlacedOrders]
      ];

      statsContainer.replaceChildren();
      metrics.forEach(([label, value]) => {
        const card = document.createElement("article");
        card.className = "stat-card";
        const heading = document.createElement("h3");
        heading.textContent = label;
        const count = document.createElement("p");
        count.textContent = value == null ? "—" : String(value);
        card.append(heading, count);
        statsContainer.appendChild(card);
      });
    } catch (error) {
      console.error("Failed to fetch dashboard stats:", error);
      const errorMessage = document.createElement("p");
      errorMessage.id = "dashboardError";
      errorMessage.textContent = error.message || "Error loading dashboard data.";
      statsContainer.replaceChildren(errorMessage);
    }
  }

  async function loadAdminName() {
    try {
      const response = await fetch(`${window.API_BASE_URL}/api/user/profile`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!response.ok) {
        throw new Error("Could not load profile.");
      }
      const user = await response.json();
      if (user.name) {
        document.getElementById("userName").textContent = user.name;
      }
    } catch (error) {
      console.error("Failed to load user profile:", error);
    }
  }
</script>

</body>
</html>
