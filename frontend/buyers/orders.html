<body>

  <h1>📦 My Orders</h1>
  <div class="orders-container" id="ordersContainer"></div>

  <a class="btn" href="buyers_dashboard.html">Back to Dashboard</a>

  <script>
    const token = localStorage.getItem("token");
    const ordersContainer = document.getElementById("ordersContainer");

    if (!token) {
      window.location.href = "../login.html";
    }

    fetch(`${window.API_BASE_URL}/api/orders`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      if (data.length === 0) {
        ordersContainer.innerHTML = "<p>No orders found.</p>";
        return;
      }

      data.reverse().forEach(order => {
        const card = document.createElement("div");
        card.className = "order-card";
        const title = document.createElement("h3");
        title.textContent = order.produce?.title || "Produce";
        const price = document.createElement("p");
        price.textContent = `Price: INR ${order.produce?.pricePerKg ?? "?"}`;
        const quantity = document.createElement("p");
        quantity.textContent = `Quantity: ${order.quantity}`;
        const placed = document.createElement("p");
        placed.textContent = `Order placed: ${order.updatedAt ?? "Unknown"}`;
        const status = document.createElement("p");
        status.append("Status: ");
        const statusValue = document.createElement("span");
        statusValue.className = getStatusClass(order.status);
        statusValue.textContent = order.status || "Unknown";
        status.appendChild(statusValue);
        card.append(title, price, quantity, placed, status);
        if (order.stripeSessionId) {
          const contractButton = document.createElement("button");
          contractButton.type = "button";
          contractButton.textContent = "Download Contract";
          contractButton.addEventListener("click", () => downloadContracts(order._id));
          card.appendChild(contractButton);
        }
        ordersContainer.appendChild(card);
      });
    })
    .catch(err => {
      console.error("Error fetching orders:", err);
      ordersContainer.innerHTML = "<p>Something went wrong.</p>";
    });

    function getStatusClass(status) {
      switch (String(status || "").toLowerCase()) {
        case "pending":
          return "pending";
        case "rejected":
          return "rejected";
        case "accepted":
          return "status";
        default:
          return "";
      }
    }

 async function downloadContracts(orderId) {
    try {
      const response = await fetch(`${window.API_BASE_URL}/api/contracts/generate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ orderId })
      });

      if (!response.ok) {
        let errorMessage = "Could not generate the contract.";
        try {
          const result = await response.json();
          errorMessage = result.message || errorMessage;
        } catch (_) {}
        throw new Error(errorMessage);
      }

      const contract = await response.blob();
      const downloadUrl = URL.createObjectURL(contract);
      const link = document.createElement("a");
      link.href = downloadUrl;
      link.download = "agrichain-contract.pdf";
      link.click();
      URL.revokeObjectURL(downloadUrl);
    } catch (error) {
      console.error("Contract download failed:", error);
      alert(error.message || "Could not download the contract.");
    }
  }
